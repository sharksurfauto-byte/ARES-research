# Qwen2.5-0.5B configuration for development
# PRD §7.3: Development model with 0.5B parameters

backbone:
  name: "Qwen/Qwen2.5-0.5B"
  revision: "main"
  torch_dtype: "bfloat16"
  device_map: "auto"
  use_cache: false
  attn_implementation: "eager"
  load_in_4bit: false
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true
  use_peft: false
  peft_config: null
  gradient_checkpointing: true
  hidden_state_layers: [-1, -6, -12, -24]

experiment:
  seed: 42
  output_dir: "outputs"
  experiment_name: "qwen_0_5b_dev"
  ddp:
    backend: "nccl"
    find_unused_parameters: false
    timeout_minutes: 30
  wandb:
    project: "ares-research"
    entity: null
    tags: ["dev", "0.5b"]
    mode: "online"
    dir: null
  checkpoint:
    save_dir: "checkpoints"
    save_every_n_steps: 1000
    save_every_n_epochs: 1
    keep_last_n: 3
    verify_sha256: true