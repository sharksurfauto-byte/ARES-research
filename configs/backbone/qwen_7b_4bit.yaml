# Qwen2.5-7B with 4-bit NF4 quantization for final experiments
# PRD §7.1: "Final experiments: Qwen2.5-7B with bitsandbytes NF4 4-bit"

backbone:
  name: "Qwen/Qwen2.5-7B"
  revision: "main"
  torch_dtype: "bfloat16"
  device_map: "auto"
  use_cache: false
  attn_implementation: "eager"
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true
  use_peft: false
  peft_config: null
  gradient_checkpointing: true
  hidden_state_layers: [-1, -6, -12, -24]

experiment:
  seed: 42
  output_dir: "outputs"
  experiment_name: "qwen_7b_4bit_final"
  ddp:
    backend: "nccl"
    find_unused_parameters: false
    timeout_minutes: 60
  wandb:
    project: "ares-research"
    entity: null
    tags: ["final", "7b", "4bit"]
    mode: "online"
    dir: null
  checkpoint:
    save_dir: "checkpoints"
    save_every_n_steps: 500
    save_every_n_epochs: 1
    keep_last_n: 5
    verify_sha256: true