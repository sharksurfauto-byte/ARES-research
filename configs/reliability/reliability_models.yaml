# GRM + LRM reliability models training configuration
# PRD §4.2, §4.3: Training pipelines

defaults:
  - backbone: qwen_0_5b
  - _self_

# Model architectures
grm:
  hidden_dim: 512
  num_layers: 2
  num_heads: 4
  dropout: 0.1
  domain_classes: 5  # general, math, code, science, reasoning

lrm:
  hidden_dim: 512
  num_layers: 2
  num_heads: 4
  dropout: 0.1

# Training configuration
training:
  # GRM training
  grm:
    learning_rate: 1e-4
    batch_size: 32
    epochs: 10
    lr_step_size: 10
    lr_gamma: 0.5
    weight_decay: 1e-4

  # LRM training
  lrm:
    learning_rate: 1e-4
    batch_size: 32
    epochs: 10
    lr_step_size: 10
    lr_gamma: 0.5
    weight_decay: 1e-4
    pos_weight: 1.0  # Class weight for BCE imbalance

# Calibration
calibration:
  # After training, apply temperature scaling + isotonic regression
  enable_calibration: true
  temp_scaling_epochs: 20
  temp_scaling_lr: 0.01
  isotonic_regression: true

# Data
data:
  # Representations directory from collect_representations.py
  representations_dir: "representations"

  # Train/val split ratio
  val_split: 0.1

# Output
output:
  checkpoint_dir: "checkpoints/reliability"
  save_every_n_epochs: 1
  keep_last_n: 3